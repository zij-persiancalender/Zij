name: Build Zij Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Inject GitHub Raw Base URL Automatically
        run: echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}" > app/src/main/assets/github_raw_base.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Optimized Release APK
        run: gradle assembleRelease -x lintVitalRelease -x lint --stacktrace
        
      - name: Upload Zij Installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Zij-v3.0-APK
          path: app/build/outputs/apk/release/app-release.apk
